<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>易数 - 梅花易数数字起卦</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        /* ============================================
           CSS Design Tokens
           ============================================ */
        :root {
            /* Colors */
            --bg-primary: #F8F5F0;
            --bg-card: #D4C5B2;
            --text-primary: #2C2C2C;
            --text-secondary: #5A5A5A;
            --accent: #8B4513;
            --accent-light: #A0522D;
            --accent-dark: #6B3410;

            /* Wuxing Colors */
            --jin: #C0C0C0;
            --mu: #228B22;
            --shui: #4169E1;
            --huo: #DC143C;
            --tu: #DAA520;

            /* Relation Colors */
            --sheng: #4CAF50;
            --ke: #F44336;
            --tong: #2196F3;

            /* Typography */
            --font-serif: 'Noto Serif SC', serif;
            --font-sans: 'Noto Sans SC', sans-serif;

            /* Spacing */
            --spacing-xs: 0.5rem;
            --spacing-sm: 1rem;
            --spacing-md: 1.5rem;
            --spacing-lg: 2rem;
            --spacing-xl: 3rem;

            /* Border Radius */
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
        }

        /* ============================================
           Reset & Base Styles
           ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            color: var(--text-primary);
            background: var(--bg-primary);
            background-image: radial-gradient(ellipse at top, rgba(255,255,255,0.8) 0%, rgba(212,197,178,0.3) 100%);
            min-height: 100vh;
            padding: var(--spacing-lg);
            line-height: 1.6;
        }

        /* ============================================
           Page Container
           ============================================ */
        .page {
            max-width: 480px;
            margin: 0 auto;
            opacity: 0;
            animation: fadeInUp 0.5s ease-out forwards;
        }

        .page[style*="display: none"] {
            animation: none;
            opacity: 0;
        }

        /* ============================================
           Casting Page
           ============================================ */
        .casting-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--spacing-lg);
        }

        /* Header */
        .app-header {
            text-align: center;
            margin-bottom: var(--spacing-md);
        }

        .app-title {
            font-family: var(--font-serif);
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: 0.3em;
            color: var(--text-primary);
            margin-bottom: var(--spacing-xs);
        }

        .app-subtitle {
            font-family: var(--font-sans);
            font-size: 0.9rem;
            color: var(--text-secondary);
            letter-spacing: 0.15em;
        }

        .yin-yang-symbol {
            width: 80px;
            height: 80px;
            margin: var(--spacing-sm) auto;
            opacity: 0.15;
        }

        /* Mode Selection */
        .mode-selection {
            display: flex;
            gap: var(--spacing-sm);
            margin-bottom: var(--spacing-lg);
        }

        .mode-btn {
            flex: 1;
            padding: 0.8rem 1rem;
            border: 2px solid var(--bg-card);
            border-radius: var(--radius-sm);
            background: transparent;
            font-family: var(--font-serif);
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 0.15em;
        }

        .mode-btn:hover {
            border-color: var(--accent-light);
            color: var(--accent);
        }

        .mode-btn.active {
            border-color: var(--accent);
            background: rgba(139, 69, 19, 0.08);
            color: var(--accent);
        }

        /* Input Section */
        .input-section {
            width: 100%;
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(212, 197, 178, 0.5);
            border-radius: var(--radius-lg);
            padding: var(--spacing-lg);
            backdrop-filter: blur(10px);
        }

        .input-group {
            margin-bottom: var(--spacing-md);
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: var(--spacing-xs);
            letter-spacing: 0.05em;
        }

        .number-inputs {
            display: flex;
            gap: var(--spacing-sm);
        }

        .number-input {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .number-input label {
            margin-bottom: var(--spacing-xs);
            font-weight: 500;
        }

        .number-input input {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid var(--bg-card);
            border-radius: var(--radius-sm);
            background: rgba(255, 255, 255, 0.8);
            font-family: var(--font-serif);
            font-size: 1.25rem;
            text-align: center;
            color: var(--text-primary);
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .number-input input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(139, 69, 19, 0.1);
        }

        .question-textarea {
            width: 100%;
            min-height: 80px;
            padding: var(--spacing-sm);
            border: 2px solid var(--bg-card);
            border-radius: var(--radius-sm);
            background: rgba(255, 255, 255, 0.8);
            font-family: var(--font-sans);
            font-size: 0.95rem;
            color: var(--text-primary);
            resize: vertical;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .question-textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(139, 69, 19, 0.1);
        }

        .question-textarea::placeholder {
            color: var(--text-secondary);
            opacity: 0.6;
        }

        /* Cast Button */
        .cast-button {
            width: 100%;
            padding: 1rem;
            background: var(--text-primary);
            color: var(--bg-primary);
            border: none;
            border-radius: var(--radius-sm);
            font-family: var(--font-serif);
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 0.2em;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
            margin-top: var(--spacing-md);
        }

        .cast-button:hover {
            background: var(--accent);
            transform: translateY(-2px);
        }

        .cast-button:active {
            transform: translateY(0);
        }

        /* ============================================
           Result Page
           ============================================ */
        .result-page {
            display: none;
        }

        .result-header {
            text-align: center;
            margin-bottom: var(--spacing-xl);
            animation: fadeInUp 0.5s ease-out 0.2s backwards;
        }

        .result-question {
            font-family: var(--font-serif);
            font-size: 1.1rem;
            color: var(--text-primary);
            margin-bottom: var(--spacing-xs);
            font-weight: 600;
        }

        .result-time {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        /* Hexagram Group */
        .hexagram-group {
            display: flex;
            gap: var(--spacing-sm);
            margin-bottom: var(--spacing-xl);
            animation: fadeInUp 0.5s ease-out 0.3s backwards;
        }

        .hexagram-card {
            flex: 1;
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(212, 197, 178, 0.6);
            border-radius: var(--radius-md);
            padding: var(--spacing-md);
            text-align: center;
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .hexagram-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
        }

        .hexagram-card.main-card {
            border-color: var(--accent);
            border-width: 2px;
        }

        .hexagram-card .label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            letter-spacing: 0.1em;
            margin-bottom: var(--spacing-xs);
        }

        .hexagram-card .svg-placeholder {
            width: 60px;
            height: 60px;
            margin: var(--spacing-sm) auto;
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.6;
        }

        .hexagram-card .hexagram-name {
            font-family: var(--font-serif);
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-top: var(--spacing-xs);
        }

        /* Analysis Sections */
        .analysis-section {
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(212, 197, 178, 0.6);
            border-radius: var(--radius-md);
            padding: var(--spacing-lg);
            margin-bottom: var(--spacing-md);
            backdrop-filter: blur(10px);
            animation: lineReveal 0.4s ease-out backwards;
        }

        .analysis-section:nth-child(1) { animation-delay: 0.4s; }
        .analysis-section:nth-child(2) { animation-delay: 0.5s; }
        .analysis-section:nth-child(3) { animation-delay: 0.6s; }
        .analysis-section:nth-child(4) { animation-delay: 0.7s; }

        .analysis-section .section-title {
            font-family: var(--font-serif);
            font-size: 1rem;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: var(--spacing-sm);
            letter-spacing: 0.1em;
            border-bottom: 1px solid rgba(139, 69, 19, 0.2);
            padding-bottom: var(--spacing-xs);
        }

        .analysis-section .section-content {
            font-size: 0.95rem;
            color: var(--text-primary);
            line-height: 1.8;
        }

        /* Wuxing Badge */
        .wuxing-badge {
            display: inline-block;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 500;
            color: white;
            margin: 0 0.2rem;
        }

        .wuxing-badge.jin { background: var(--jin); color: var(--text-primary); }
        .wuxing-badge.mu { background: var(--mu); }
        .wuxing-badge.shui { background: var(--shui); }
        .wuxing-badge.huo { background: var(--huo); }
        .wuxing-badge.tu { background: var(--tu); }

        /* Relation Indicator */
        .relation-indicator {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 500;
            margin: 0 0.2rem;
        }

        .relation-indicator.sheng {
            background: rgba(76, 175, 80, 0.1);
            color: var(--sheng);
            border: 1px solid rgba(76, 175, 80, 0.3);
        }

        .relation-indicator.ke {
            background: rgba(244, 67, 54, 0.1);
            color: var(--ke);
            border: 1px solid rgba(244, 67, 54, 0.3);
        }

        .relation-indicator.tong {
            background: rgba(33, 150, 243, 0.1);
            color: var(--tong);
            border: 1px solid rgba(33, 150, 243, 0.3);
        }

        /* Yao Item */
        .yao-item {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            padding: var(--spacing-xs) 0;
            border-bottom: 1px solid rgba(212, 197, 178, 0.3);
        }

        .yao-item:last-child {
            border-bottom: none;
        }

        .yao-item.active {
            background: rgba(139, 69, 19, 0.05);
            padding: var(--spacing-xs);
            border-radius: var(--radius-sm);
            border-left: 3px solid var(--accent);
        }

        .yao-item .yao-number {
            width: 24px;
            height: 24px;
            background: var(--bg-card);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .yao-item.active .yao-number {
            background: var(--accent);
            color: white;
        }

        .yao-item .yao-line {
            flex: 1;
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .yao-item .yao-line .line-segment {
            height: 4px;
            background: var(--text-primary);
            border-radius: 2px;
        }

        .yao-item .yao-line .line-segment.yang {
            flex: 1;
        }

        .yao-item .yao-line .line-segment.yin {
            flex: 0.4;
        }

        .yao-item .yao-desc {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        /* Restart Button */
        .restart-button {
            width: 100%;
            padding: 1rem;
            background: transparent;
            color: var(--text-secondary);
            border: 2px solid var(--bg-card);
            border-radius: var(--radius-sm);
            font-family: var(--font-serif);
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.15em;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: var(--spacing-lg);
            animation: fadeInUp 0.5s ease-out 0.8s backwards;
        }

        .restart-button:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(139, 69, 19, 0.05);
        }

        /* SVG Hexagram */
        .hex-svg {
            display: block;
            overflow: visible;
        }

        .hex-line {
            transform-origin: center;
        }

        /* ============================================
           Hexagram Blocks (三卦独立展示)
           ============================================ */
        .hexagram-block {
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(212, 197, 178, 0.5);
            border-radius: var(--radius-lg);
            padding: var(--spacing-lg);
            margin-bottom: var(--spacing-md);
        }

        .hexagram-block.ben {
            border-left: 3px solid var(--accent);
        }

        .block-header {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-md);
            padding-bottom: var(--spacing-md);
            border-bottom: 1px solid rgba(212, 197, 178, 0.4);
        }

        .block-header .hex-svg {
            flex-shrink: 0;
        }

        .block-header .header-text .hex-name {
            font-family: var(--font-serif);
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .block-header .header-text .hex-label {
            font-size: 0.8rem;
            color: var(--accent);
            letter-spacing: 0.1em;
            margin-bottom: 0.25rem;
        }

        .block-body .gua-ci {
            font-family: var(--font-serif);
            font-size: 1.05rem;
            line-height: 1.8;
            color: var(--text-primary);
            margin-bottom: var(--spacing-sm);
            padding: var(--spacing-sm);
            background: rgba(139, 69, 19, 0.03);
            border-radius: var(--radius-sm);
        }

        .block-body .gua-meaning {
            font-size: 0.95rem;
            line-height: 1.7;
            color: var(--text-secondary);
        }

        /* 爻辞 within 本卦 block */
        .yao-section {
            margin-top: var(--spacing-md);
            padding-top: var(--spacing-md);
            border-top: 1px solid rgba(212, 197, 178, 0.3);
        }

        .yao-section-title {
            font-family: var(--font-serif);
            font-size: 0.9rem;
            color: var(--accent);
            margin-bottom: var(--spacing-sm);
            letter-spacing: 0.05em;
        }

        /* ============================================
           体用分析卡片
           ============================================ */
        .tiyong-card {
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(212, 197, 178, 0.5);
            border-radius: var(--radius-md);
            padding: var(--spacing-md);
            margin-bottom: var(--spacing-lg);
            text-align: center;
        }

        .tiyong-title {
            font-family: var(--font-serif);
            font-size: 0.9rem;
            color: var(--accent);
            margin-bottom: var(--spacing-sm);
        }

        .tiyong-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: var(--spacing-md);
            font-size: 1rem;
            margin-bottom: var(--spacing-xs);
        }

        .tiyong-relation {
            display: inline-block;
            padding: 0.3rem 1rem;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.95rem;
            margin-top: var(--spacing-xs);
        }

        /* ============================================
           三卦综观 / Summary
           ============================================ */
        .summary-section {
            background: rgba(139, 69, 19, 0.04);
            border: 1px solid rgba(139, 69, 19, 0.15);
            border-radius: var(--radius-lg);
            padding: var(--spacing-lg);
            margin-top: var(--spacing-md);
            margin-bottom: var(--spacing-md);
        }

        .summary-title {
            font-family: var(--font-serif);
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--accent);
            text-align: center;
            margin-bottom: var(--spacing-md);
            letter-spacing: 0.1em;
        }

        .summary-sub {
            font-family: var(--font-serif);
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-top: var(--spacing-md);
            margin-bottom: var(--spacing-xs);
            padding-left: 0.5rem;
            border-left: 2px solid var(--accent);
        }

        .summary-text {
            font-size: 0.95rem;
            line-height: 1.8;
            color: var(--text-secondary);
        }

        /* ============================================
           Animations
           ============================================ */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes lineReveal {
            from {
                opacity: 0;
                transform: translateX(-20px);
                clip-path: inset(0 100% 0 0);
            }
            to {
                opacity: 1;
                transform: translateX(0);
                clip-path: inset(0 0 0 0);
            }
        }

        /* ============================================
           Responsive Design
           ============================================ */
        @media (max-width: 480px) {
            body {
                padding: var(--spacing-sm);
            }

            .app-title {
                font-size: 2rem;
            }

            .hexagram-group {
                flex-direction: column;
            }

            .hexagram-card {
                padding: var(--spacing-sm);
            }

            .analysis-section {
                padding: var(--spacing-md);
            }
        }
    </style>
</head>
<body>
    <!-- Casting Page -->
    <div class="page casting-page" id="castingPage">
        <header class="app-header">
            <h1 class="app-title">易 数</h1>
            <p class="app-subtitle">梅花易数 · 数字起卦</p>
            <svg class="yin-yang-symbol" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="50" r="48" fill="none" stroke="currentColor" stroke-width="2"/>
                <path d="M50 2 A48 48 0 0 1 50 98 A24 24 0 0 1 50 50 A24 24 0 0 0 50 2" fill="currentColor"/>
                <circle cx="50" cy="26" r="8" fill="currentColor"/>
                <circle cx="50" cy="74" r="8" fill="none" stroke="currentColor" stroke-width="2"/>
            </svg>
        </header>

        <div class="input-section">
            <div class="mode-selection">
                <button class="mode-btn active" data-mode="seek">寻 物</button>
                <button class="mode-btn" data-mode="ask">问 世</button>
            </div>

            <div class="input-group">
                <label>输入三个数字起卦（0-999）</label>
                <div class="number-inputs">
                    <div class="number-input">
                        <label>上卦</label>
                        <input type="number" id="num1" min="0" max="999" placeholder="数字">
                    </div>
                    <div class="number-input">
                        <label>下卦</label>
                        <input type="number" id="num2" min="0" max="999" placeholder="数字">
                    </div>
                    <div class="number-input">
                        <label>动爻</label>
                        <input type="number" id="num3" min="0" max="999" placeholder="数字">
                    </div>
                </div>
            </div>

            <div class="input-group">
                <label id="questionLabel">所寻之物（选填）</label>
                <textarea class="question-textarea" id="question" placeholder="请输入您要寻找的物品..."></textarea>
            </div>

            <button class="cast-button" id="castButton">起 卦</button>
        </div>
    </div>

    <!-- Result Page -->
    <div class="page result-page" id="resultPage">
        <div class="result-header">
            <p class="result-question" id="resultQuestion"></p>
            <p class="result-time" id="resultTime"></p>
        </div>

        <div class="hexagram-group" id="hexagramGroup"></div>

        <div id="analysis-container"></div>

        <button class="restart-button" id="restartButton">重新起卦</button>
    </div>

    <script>
        // ========== 八卦数据（先天八卦序）==========
        const TRIGRAMS = {
          1: { name: '乾', symbol: '☰', element: 'jin', nature: '天', direction: '西北', lines: [1,1,1] },
          2: { name: '兑', symbol: '☱', element: 'jin', nature: '泽', direction: '西', lines: [1,1,0] },
          3: { name: '离', symbol: '☲', element: 'huo', nature: '火', direction: '南', lines: [1,0,1] },
          4: { name: '震', symbol: '☳', element: 'mu', nature: '雷', direction: '东', lines: [1,0,0] },
          5: { name: '巽', symbol: '☴', element: 'mu', nature: '风', direction: '东南', lines: [0,1,1] },
          6: { name: '坎', symbol: '☵', element: 'shui', nature: '水', direction: '北', lines: [0,1,0] },
          7: { name: '艮', symbol: '☶', element: 'tu', nature: '山', direction: '东北', lines: [0,0,1] },
          8: { name: '坤', symbol: '☷', element: 'tu', nature: '地', direction: '西南', lines: [0,0,0] }
        };

        const ELEMENTS = {
          jin: { name: '金', class: 'wuxing-jin' },
          mu:  { name: '木', class: 'wuxing-mu' },
          shui:{ name: '水', class: 'wuxing-shui' },
          huo: { name: '火', class: 'wuxing-huo' },
          tu:  { name: '土', class: 'wuxing-tu' }
        };

        // 五行生克关系
        const SHENG_KE = {
          jin:  { sheng: 'shui', ke: 'mu',  shengBy: 'tu',  keBy: 'huo' },

        // ========== 天干地支算法 ==========
        const TIAN_GAN = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
        const DI_ZHI = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
        const DI_ZHI_SHU = { '子':1,'丑':2,'寅':3,'卯':4,'辰':5,'巳':6,'午':7,'未':8,'申':9,'酉':10,'戌':11,'亥':12 };

        function getGanZhi(date) {
          const year = date.getFullYear();
          const month = date.getMonth() + 1;
          const day = date.getDate();
          const hour = date.getHours();

          // 年干支
          const yearGanIdx = (year - 4) % 10;
          const yearZhiIdx = (year - 4) % 12;
          const yearGanZhi = TIAN_GAN[yearGanIdx] + DI_ZHI[yearZhiIdx];

          // 月干支
          const monthGanIdx = (yearGanIdx * 2 + month) % 10;
          const monthZhiIdx = (month + 1) % 12;
          const monthGanZhi = TIAN_GAN[monthGanIdx] + DI_ZHI[monthZhiIdx];

          // 日干支（基于已知基准日 2000-01-07 为甲子日）
          const baseDate = new Date(2000, 0, 7);
          const daysDiff = Math.floor((date - baseDate) / (1000 * 60 * 60 * 24));
          const dayGanIdx = ((daysDiff % 10) + 10) % 10;
          const dayZhiIdx = ((daysDiff % 12) + 12) % 12;
          const dayGanZhi = TIAN_GAN[dayGanIdx] + DI_ZHI[dayZhiIdx];

          // 时辰
          const hourZhiIdx = Math.floor(((hour + 1) % 24) / 2);
          const hourZhi = DI_ZHI[hourZhiIdx];
          const hourShu = DI_ZHI_SHU[hourZhi];

          return {
            year: yearGanZhi,
            month: monthGanZhi,
            day: dayGanZhi,
            hour: hourZhi,
            hourShu: hourShu,
            display: `${yearGanZhi}年 ${monthGanZhi}月 ${dayGanZhi}日 ${hourZhi}时`
          };
        }

        // ========== 梅花易数算法 ==========

        function castHexagram(num1, num2, num3) {
          const now = new Date();
          const ganzhi = getGanZhi(now);

          // 上卦：第一个数字除以8取余
          const upperRemainder = num1 % 8;
          const upperKey = upperRemainder === 0 ? 8 : upperRemainder;

          // 下卦：第二个数字除以8取余
          const lowerRemainder = num2 % 8;
          const lowerKey = lowerRemainder === 0 ? 8 : lowerRemainder;

          // 动爻
          let dongYao;
          if (num3 !== null && num3 !== undefined) {
            dongYao = num3 % 6;
            if (dongYao === 0) dongYao = 6;
          } else {
            dongYao = (num1 + num2 + ganzhi.hourShu) % 6;
            if (dongYao === 0) dongYao = 6;
          }

          const upperTrigram = TRIGRAMS[upperKey];
          const lowerTrigram = TRIGRAMS[lowerKey];

          // 本卦六爻（从下到上）
          const benGuaLines = [...lowerTrigram.lines, ...upperTrigram.lines];

          // 变卦：动爻阴阳互换
          const bianGuaLines = [...benGuaLines];
          bianGuaLines[dongYao - 1] = bianGuaLines[dongYao - 1] === 1 ? 0 : 1;

          // 互卦：取2,3,4爻为下卦；3,4,5爻为上卦
          const huLower = [benGuaLines[1], benGuaLines[2], benGuaLines[3]];
          const huUpper = [benGuaLines[2], benGuaLines[3], benGuaLines[4]];

          function findHexagramByLines(lines) {
            const lower = lines.slice(0, 3);
            const upper = lines.slice(3, 6);
            function trigramKey(tLines) {
              for (const [key, tri] of Object.entries(TRIGRAMS)) {
                if (tri.lines[0] === tLines[0] && tri.lines[1] === tLines[1] && tri.lines[2] === tLines[2]) {
                  return parseInt(key);
                }
              }
              return 1;
            }
            const uKey = trigramKey(upper);
            const lKey = trigramKey(lower);
            return `${uKey}-${lKey}`;
          }

          const benKey = findHexagramByLines(benGuaLines);
          const bianKey = findHexagramByLines(bianGuaLines);
          const huKey = findHexagramByLines([...huLower, ...huUpper]);

          const benGua = HEXAGRAMS[benKey];
          const bianGua = HEXAGRAMS[bianKey];
          const huGua = HEXAGRAMS[huKey];

          // 体用分析
          let tiGua, yongGua;
          if (dongYao <= 3) {
            tiGua = upperTrigram;
            yongGua = lowerTrigram;
          } else {
            tiGua = lowerTrigram;
            yongGua = upperTrigram;
          }

          const tiElement = tiGua.element;
          const yongElement = yongGua.element;
          const relation = getWuxingRelation(tiElement, yongElement);

          return {
            time: now,
            ganzhi: ganzhi,
            numbers: [num1, num2, num3].filter(n => n !== null && n !== undefined),
            dongYao: dongYao,
            benGua: { ...benGua, key: benKey, lines: benGuaLines, upper: upperTrigram, lower: lowerTrigram },
            bianGua: { ...bianGua, key: bianKey, lines: bianGuaLines },
            huGua: { ...huGua, key: huKey, lines: [...huLower, ...huUpper] },
            tiGua: tiGua,
            yongGua: yongGua,
            relation: relation
          };
        }

        function getWuxingRelation(tiElement, yongElement) {
          if (tiElement === yongElement) {
            return { type: 'tong', desc: '比和', meaning: '体用相同，事情平稳' };
          }
          const sheng = SHENG_KE[tiElement];
          if (sheng.sheng === yongElement) {
            return { type: 'sheng', desc: '体生用', meaning: '体卦生助用卦，主耗泄，宜付出' };
          }
          if (sheng.ke === yongElement) {
            return { type: 'ke', desc: '体克用', meaning: '体卦克制用卦，主有掌控力，吉利' };
          }
          if (sheng.shengBy === yongElement) {
            return { type: 'sheng', desc: '用生体', meaning: '用卦生助体卦，主有贵人相助，大吉' };
          }
          if (sheng.keBy === yongElement) {
            return { type: 'ke', desc: '用克体', meaning: '用卦克制体卦，主有阻碍，宜谨慎' };
          }
          return { type: 'unknown', desc: '未知', meaning: '' };
        }

        // ========== SVG 卦象渲染 ==========

        function createHexagramSVG(lines, dongYao, size) {
          const width = size || 80;
          const lineWidth = width * 0.8;
          const lineHeight = width * 0.08;
          const gap = width * 0.14;
          const padding = width * 0.1;

          const totalHeight = padding * 2 + 6 * lineHeight + 5 * gap;
          const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
          svg.setAttribute('width', width);
          svg.setAttribute('height', totalHeight);
          svg.setAttribute('viewBox', `0 0 ${width} ${totalHeight}`);
          svg.classList.add('hex-svg');

          for (let i = 5; i >= 0; i--) {
            const y = padding + (5 - i) * (lineHeight + gap);
            const isYang = lines[i] === 1;
            const isActive = (i + 1) === dongYao;
            const delay = (5 - i) * 0.08;

            const group = document.createElementNS('http://www.w3.org/2000/svg', 'g');
            group.classList.add('hex-line');
            if (isActive) group.classList.add('active-line');
            group.style.opacity = '0';
            group.style.animation = `lineReveal 0.4s ease ${delay}s forwards`;

            if (isYang) {
              const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
              rect.setAttribute('x', (width - lineWidth) / 2);
              rect.setAttribute('y', y);
              rect.setAttribute('width', lineWidth);
              rect.setAttribute('height', lineHeight);
              rect.setAttribute('rx', lineHeight / 2);
              rect.setAttribute('fill', isActive ? 'var(--accent)' : 'var(--text-primary)');
              group.appendChild(rect);
            } else {
              const segWidth = (lineWidth - lineHeight) / 2;
              const x1 = (width - lineWidth) / 2;
              const x2 = x1 + segWidth + lineHeight;

              const rect1 = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
              rect1.setAttribute('x', x1);
              rect1.setAttribute('y', y);
              rect1.setAttribute('width', segWidth);
              rect1.setAttribute('height', lineHeight);
              rect1.setAttribute('rx', lineHeight / 2);
              rect1.setAttribute('fill', isActive ? 'var(--accent)' : 'var(--text-primary)');
              group.appendChild(rect1);

              const rect2 = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
              rect2.setAttribute('x', x2);
              rect2.setAttribute('y', y);
              rect2.setAttribute('width', segWidth);
              rect2.setAttribute('height', lineHeight);
              rect2.setAttribute('rx', lineHeight / 2);
              rect2.setAttribute('fill', isActive ? 'var(--accent)' : 'var(--text-primary)');
              group.appendChild(rect2);
            }

            svg.appendChild(group);
          }

          return svg;
        }

        // ========== UI 交互 ==========

        const pageCast = document.getElementById('page-cast') || document.querySelector('.casting-page') || document.querySelector('[class*="cast"]');
        const pageResult = document.getElementById('page-result') || document.querySelector('.result-page') || document.querySelector('[class*="result"]');
        const btnCast = document.getElementById('btn-cast') || document.querySelector('.cast-button') || document.querySelector('button[class*="cast"]');
        const btnRestart = document.getElementById('btn-restart') || document.querySelector('.restart-button') || document.querySelector('button[class*="restart"]');
        const num1Input = document.getElementById('num1') || document.querySelector('input[placeholder*="上卦"]') || document.querySelectorAll('.number-input input')[0];
        const num2Input = document.getElementById('num2') || document.querySelector('input[placeholder*="下卦"]') || document.querySelectorAll('.number-input input')[1];
        const num3Input = document.getElementById('num3') || document.querySelector('input[placeholder*="动爻"]') || document.querySelectorAll('.number-input input')[2];
        const questionInput = document.getElementById('question') || document.querySelector('.question-textarea') || document.querySelector('textarea');

        // 模式选择
        let currentMode = 'seek'; // 默认寻物模式
        const questionLabel = document.getElementById('questionLabel');
        const modeBtns = document.querySelectorAll('.mode-btn');
        modeBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                modeBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentMode = btn.dataset.mode;
                // 更新placeholder和label
                if (currentMode === 'seek') {
                    questionInput.placeholder = '请输入您要寻找的物品...';
                    if (questionLabel) questionLabel.textContent = '所寻之物（选填）';
                } else {
                    questionInput.placeholder = '请输入您想问的问题...';
                    if (questionLabel) questionLabel.textContent = '所问之事（选填）';
                }
            });
        });

        if (btnCast) {
          btnCast.addEventListener('click', handleCast);
        }

        if (btnRestart) {
          btnRestart.addEventListener('click', handleRestart);
        }

        document.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' && pageCast && pageCast.style.display !== 'none') {
            handleCast();
          }
        });

        function parseCastNumber(value, optional = false) {
          const text = value.trim();
          if (optional && text === '') return null;
          if (!/^\d{1,3}$/.test(text)) {
            throw new Error('请输入 0–999 之间的整数，第三个数字可留空');
          }
          return Number(text);
        }

        function handleCast() {
          let num1, num2, num3;
          try {
            num1 = parseCastNumber(num1Input.value);
            num2 = parseCastNumber(num2Input.value);
            num3 = parseCastNumber(num3Input.value, true);
          } catch (error) {
            alert(error.message);
            return;
          }

          const result = castHexagram(num1, num2, num3);
          renderResult(result, questionInput.value);
        }

        function handleRestart() {
          if (pageResult) pageResult.style.display = 'none';
          if (pageCast) pageCast.style.display = '';
          if (num1Input) num1Input.value = '';
          if (num2Input) num2Input.value = '';
          if (num3Input) num3Input.value = '';
          if (questionInput) questionInput.value = '';
          if (num1Input) num1Input.focus();
          // 保持当前模式不变，不重置
        }

        // ========== 结果页渲染 ==========

        function renderResult(result, question) {
          // 切换页面
          if (pageCast) pageCast.style.display = 'none';
          if (pageResult) {
            pageResult.style.display = 'block';
            pageResult.style.opacity = '0';
            requestAnimationFrame(() => {
              pageResult.style.transition = 'opacity 0.5s ease';
              pageResult.style.opacity = '1';
            });
          }

          // 时间和问题
          const questionEl = document.getElementById('resultQuestion') || document.querySelector('.result-question');
          const timeEl = document.getElementById('resultTime') || document.querySelector('.result-time');
          const modeLabel = currentMode === 'seek' ? '寻物' : '问世';
          if (questionEl) questionEl.textContent = question ? `【${modeLabel}】${currentMode === 'seek' ? '所寻之物：' : '所问：'}${question}` : `【${modeLabel}】`;
          if (timeEl) timeEl.textContent = `${result.ganzhi.display}  |  数字：${result.numbers.join(', ')}`;

          // 卦象简要卡片区（三张小卡片）
          const hexGroup = document.getElementById('hexagramGroup') || document.querySelector('.hexagram-group');
          if (hexGroup) {
            hexGroup.innerHTML = '';
            hexGroup.appendChild(createHexCard(result.benGua, '本 卦', result.dongYao, 120));
            hexGroup.appendChild(createHexCard(result.huGua, '互 卦', null, 70));
            hexGroup.appendChild(createHexCard(result.bianGua, '变 卦', null, 70));
          }

          // 主解析区
          const container = document.getElementById('analysis-container');
          if (!container) return;
          container.innerHTML = '';

          // ===== 体用分析卡片 =====
          const tiElement = ELEMENTS[result.tiGua.element];
          const yongElement = ELEMENTS[result.yongGua.element];
          const relClass = result.relation.type === 'sheng' ? 'sheng' :
                           result.relation.type === 'ke' ? 'ke' : 'tong';

          const tiyongCard = document.createElement('div');
          tiyongCard.className = 'tiyong-card';
          tiyongCard.innerHTML = `
            <div class="tiyong-title">体 用 分 析</div>
            <div class="tiyong-row">
              <span>体卦：<span class="wuxing-badge ${result.tiGua.element}">${result.tiGua.name} ${tiElement.name}</span></span>
              <span style="color:var(--accent);">⇌</span>
              <span>用卦：<span class="wuxing-badge ${result.yongGua.element}">${result.yongGua.name} ${yongElement.name}</span></span>
            </div>
            <div class="tiyong-relation ${relClass}">${result.relation.desc}</div>
            <p style="margin-top:0.5rem;color:var(--text-secondary);font-size:0.9rem;">${result.relation.meaning}</p>
          `;
          container.appendChild(tiyongCard);

          // ===== 寻物模式：方位分析卡片 =====
          if (currentMode === 'seek') {
            container.appendChild(buildSeekDirectionCard(result));
          }

          // ===== 本卦详情 =====
          container.appendChild(buildHexagramBlock(
            result.benGua, '本 卦', result.dongYao, 140, true,
            currentMode === 'seek' ? '物品状态' : '当前状态',
            true, result.dongYao
          ));

          // ===== 互卦详情 =====
          container.appendChild(buildHexagramBlock(
            result.huGua, '互 卦', null, 100, false,
            currentMode === 'seek' ? '寻找过程' : '发展过程'
          ));

          // ===== 变卦详情 =====
          container.appendChild(buildHexagramBlock(
            result.bianGua, '变 卦', null, 100, false,
            currentMode === 'seek' ? '最终结果' : '最终结果'
          ));

          // ===== 三卦综观 =====
          if (currentMode === 'seek') {
            container.appendChild(buildSeekSummary(result));
          } else {
            container.appendChild(buildSummary(result));
          }
        }

        function createHexCard(hexData, label, dongYao, svgSize) {
          const card = document.createElement('div');
          card.className = 'hexagram-card' + (label === '本 卦' ? ' main-card' : '');
          const labelEl = document.createElement('div');
          labelEl.className = 'label';
          labelEl.textContent = label;
          card.appendChild(labelEl);
          const svg = createHexagramSVG(hexData.lines, dongYao, svgSize);
          card.appendChild(svg);
          const nameEl = document.createElement('div');
          nameEl.className = 'hexagram-name';
          nameEl.textContent = hexData.name;
          card.appendChild(nameEl);
          return card;
        }

        function buildHexagramBlock(hexData, label, dongYao, svgSize, isBen, contextLabel, includeYao, activeYao) {
          const block = document.createElement('div');
          block.className = 'hexagram-block' + (isBen ? ' ben' : '');

          // Header: SVG + name
          const header = document.createElement('div');
          header.className = 'block-header';
          header.innerHTML = `
            <div class="header-text">
              <div class="hex-label">${label} · ${contextLabel || ''}</div>
              <div class="hex-name">${hexData.name}</div>
            </div>
          `;
          const svg = createHexagramSVG(hexData.lines, dongYao, svgSize);
          header.insertBefore(svg, header.firstChild);
          block.appendChild(header);

          // Body: 卦辞 + 含义
          const body = document.createElement('div');
          body.className = 'block-body';
          body.innerHTML = `
            <div class="gua-ci">${hexData.guaCi}</div>
            <div class="gua-meaning">${hexData.summary || ''}</div>
          `;
          block.appendChild(body);

          // 爻辞（仅本卦）
          if (includeYao && hexData.yaoCi) {
            const yaoSection = document.createElement('div');
            yaoSection.className = 'yao-section';
            yaoSection.innerHTML = '<div class="yao-section-title">六 爻 解 读</div>';
            const yaoList = document.createElement('div');
            for (let i = 5; i >= 0; i--) {
              const isActive = (i + 1) === activeYao;
              const yaoItem = document.createElement('div');
              yaoItem.className = 'yao-item' + (isActive ? ' active' : '');
              yaoItem.innerHTML = `
                <span class="yao-number">${i + 1}</span>
                <div class="yao-line"><span class="line-segment ${hexData.lines[i] === 1 ? 'yang' : 'yin'}"></span></div>
                <span class="yao-desc">${hexData.yaoCi[i]}</span>
              `;
              yaoList.appendChild(yaoItem);
            }
            yaoSection.appendChild(yaoList);
            block.appendChild(yaoSection);
          }

          return block;
        }

        function buildSeekDirectionCard(result) {
          const card = document.createElement('div');
          card.className = 'tiyong-card';
          card.style.borderLeft = '3px solid var(--accent)';

          // 获取体卦和用卦的方位
          const tiDirection = result.tiGua.direction;
          const yongDirection = result.yongGua.direction;

          // 根据体用关系判断方位
          let primaryDirection, secondaryDirection, directionDesc;

          if (result.relation.type === 'tong') {
            // 比和：物品就在体卦方位附近
            primaryDirection = tiDirection;
            secondaryDirection = yongDirection;
            directionDesc = '体用比和，物品应在体卦方位附近，即<b>' + tiDirection + '方</b>。用卦方位' + yongDirection + '亦可留意。';
          } else if (result.relation.type === 'sheng') {
            if (result.relation.desc === '体生用') {
              // 体生用：物品被泄，可能在用卦方位
              primaryDirection = yongDirection;
              secondaryDirection = tiDirection;
              directionDesc = '体生用，物品能量外泄，极可能在<b>' + yongDirection + '方</b>。体卦' + tiDirection + '方亦有可能。';
            } else {
              // 用生体：物品被生助，可能在体卦方位
              primaryDirection = tiDirection;
              secondaryDirection = yongDirection;
              directionDesc = '用生体，物品受生助而聚于体卦，应在<b>' + tiDirection + '方</b>。用卦' + yongDirection + '方亦可参考。';
            }
          } else {
            if (result.relation.desc === '体克用') {
              // 体克用：物品可寻，在用卦方位
              primaryDirection = yongDirection;
              secondaryDirection = tiDirection;
              directionDesc = '体克用，物品受制于体卦方位之力，在<b>' + yongDirection + '方</b>可寻得。' + tiDirection + '方亦有可能。';
            } else {
              // 用克体：物品难寻，需在体卦方位多留意
              primaryDirection = tiDirection;
              secondaryDirection = yongDirection;
              directionDesc = '用克体，物品方位不定，宜先查<b>' + tiDirection + '方</b>，再寻' + yongDirection + '方。需耐心寻找。';
            }
          }

          // 获取八卦的象征物
          const tiNature = result.tiGua.nature;
          const yongNature = result.yongGua.nature;

          const natureHints = {
            '天': '高处、金属制品、圆形物',
            '泽': '低洼处、水边、破损处',
            '火': '明亮处、电器旁、文书堆',
            '雷': '震动处、木质家具旁、东方',
            '风': '通风处、窗边、缝隙中',
            '水': '水边、暗处、北方',
            '山': '高处、土石旁、东北方',
            '地': '低处、容器内、西南角'
          };

          card.innerHTML = `
            <div class="tiyong-title">寻 物 方 位</div>
            <div style="text-align:center;margin:1rem 0;">
              <div style="font-size:1.5rem;font-weight:700;color:var(--accent);margin-bottom:0.5rem;">
                ${primaryDirection}方
              </div>
              <div style="font-size:0.85rem;color:var(--text-secondary);">
                次要方位：${secondaryDirection}方
              </div>
            </div>
            <div style="font-size:0.9rem;line-height:1.8;color:var(--text-secondary);margin-top:1rem;padding:0.8rem;background:rgba(139,69,19,0.03);border-radius:var(--radius-sm);">
              ${directionDesc}
            </div>
            <div style="font-size:0.85rem;line-height:1.7;color:var(--text-secondary);margin-top:0.8rem;">
              <b>卦象提示：</b>体卦为${result.tiGua.name}（${tiNature}），${natureHints[tiNature] || '相关方位'}；用卦为${result.yongGua.name}（${yongNature}），${natureHints[yongNature] || '相关方位'}。可根据物品类型参考卦象所指之处。
            </div>
          `;
          return card;
        }

        function buildSeekSummary(result) {
          const section = document.createElement('div');
          section.className = 'summary-section';

          const tiDirection = result.tiGua.direction;
          const yongDirection = result.yongGua.direction;

          // 根据体用关系判断寻找难度和方位
          let difficulty, locationAdvice, timeAdvice;

          if (result.relation.type === 'tong') {
            difficulty = '容易';
            locationAdvice = `物品应在<b>${tiDirection}方</b>或<b>${yongDirection}方</b>附近。体用比和，物品未远离，仔细寻找定能找到。`;
            timeAdvice = '近期可寻得，宜尽快行动。';
          } else if (result.relation.desc === '用生体') {
            difficulty = '容易';
            locationAdvice = `物品在<b>${tiDirection}方</b>可能性最大，${yongDirection}方亦可查看。用生体，物品被助聚于体卦方位。`;
            timeAdvice = '近期可寻得，物品未丢失太远。';
          } else if (result.relation.desc === '体生用') {
            difficulty = '较难';
            locationAdvice = `物品极可能在<b>${yongDirection}方</b>，${tiDirection}方亦有可能。体生用，物品能量外泄，可能已移位。`;
            timeAdvice = '需耐心寻找，可能需要较长时间。';
          } else if (result.relation.desc === '体克用') {
            difficulty = '中等';
            locationAdvice = `物品在<b>${yongDirection}方</b>可寻得，${tiDirection}方亦有可能。体克用，物品受制，终可寻回。`;
            timeAdvice = '需要一番寻找，但终能找到。';
          } else {
            difficulty = '较难';
            locationAdvice = `物品方位不定，宜先查<b>${tiDirection}方</b>，再寻${yongDirection}方。用克体，物品受克，可能被遮盖或移动。`;
            timeAdvice = '寻找难度较大，需多方查找。';
          }

          // 获取卦象的象征物提示
          const tiNature = result.tiGua.nature;
          const yongNature = result.yongGua.nature;

          const natureHints = {
            '天': '高处、金属旁、圆形物体上',
            '泽': '低洼处、水边、破损处',
            '火': '明亮处、电器旁、文书堆中',
            '雷': '震动处、木质家具旁',
            '风': '通风处、窗边、缝隙中',
            '水': '水边、暗处、容器内',
            '山': '高处、土石旁、柜子上',
            '地': '低处、容器内、角落'
          };

          section.innerHTML = `
            <div class="summary-title">寻 物 综 观</div>
            <div class="summary-sub">寻找难度</div>
            <div class="summary-text">
              <span style="font-size:1.1rem;font-weight:600;color:var(--accent);">${difficulty}</span>
              <span style="margin-left:0.5rem;color:var(--text-secondary);">体用${result.relation.desc}，${result.relation.meaning}</span>
            </div>
            <div class="summary-sub">方位指引</div>
            <div class="summary-text">${locationAdvice}</div>
            <div class="summary-sub">物品可能位置</div>
            <div class="summary-text">
              体卦${result.tiGua.name}（${tiNature}）：${natureHints[tiNature] || '相关方位'}<br>
              用卦${result.yongGua.name}（${yongNature}）：${natureHints[yongNature] || '相关方位'}
            </div>
            <div class="summary-sub">时间提示</div>
            <div class="summary-text">${timeAdvice}</div>
            <div class="summary-sub">动爻提示</div>
            <div class="summary-text">动爻在第${result.dongYao}爻，提示此为关键信息。爻辞所言，可作参考。</div>
          `;
          return section;
        }

        function buildSummary(result) {
          const section = document.createElement('div');
          section.className = 'summary-section';

          // 生成总结文字
          const benName = result.benGua.name;
          const huName = result.huGua.name;
          const bianName = result.bianGua.name;
          const relMeaning = result.relation.meaning;

          // 走向判断
          const isJi = (result.relation.type === 'sheng' && SHENG_KE[result.yongGua.element].sheng === result.tiGua.element)
            || result.relation.type === 'tong'
            || (result.relation.type === 'ke' && SHENG_KE[result.tiGua.element].ke === result.yongGua.element);

          const direction = isJi ? '整体趋势向好，宜顺势而为。' : '当前形势有阻力，宜审慎行事，以柔克刚。';

          const connection = `${benName}为体，揭示当下所处的境地与根本状态；` +
            `${huName}为过程，呈现事物发展中的转折与内在动力；` +
            `${bianName}为果，昭示演变之归宿与最终趋势。三卦递进，由因而果，勾勒出完整的时空图景。`;

          const guidance = isJi
            ? `体用${result.relation.desc}，${result.relation.meaning}。` +
              `此时宜把握良机，主动进取，同时保持谦和之心。` +
              `注意${result.tiGua.element === 'jin' ? '刚健易折，宜柔不宜刚' : '顺势而为，忌逆势而动'}。`
            : `体用${result.relation.desc}，${result.relation.meaning}。` +
              `此时不宜冒进，宜守不宜攻，静观其变。` +
              `待时运流转，自可化险为夷。`;

          const cautions = isJi
            ? `虽整体吉利，但需警惕${result.bianGua.name}所示之隐忧，不可因顺境而大意失察。` +
              `动爻在${result.dongYao}爻，提示此乃关键节点，须格外留心。`
            : `变卦${result.bianGua.name}提示转机所在，不因时艰而消沉，` +
              `坚守正道信心，逆境亦能成就非凡。`;

          section.innerHTML = `
            <div class="summary-title">三 卦 综 观</div>
            <div class="summary-sub">三卦联系</div>
            <div class="summary-text">${connection}</div>
            <div class="summary-sub">未来指引</div>
            <div class="summary-text">${direction}<br><br>${guidance}</div>
            <div class="summary-sub">注意事项</div>
            <div class="summary-text">${cautions}</div>
          `;

          return section;
        }
    </script>
</body>
</html>
